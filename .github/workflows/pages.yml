name: Market Correction Lab · Tests and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 23 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Python
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test calculation engine
        run: node --test tests/*.test.cjs
      - name: Build and fetch permitted public macro data
        run: python scripts/build_site.py --out dist --fetch-bls
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
